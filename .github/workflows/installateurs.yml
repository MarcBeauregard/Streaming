# Construit les installateurs de FeedSwitch (Windows, macOS, Linux).
# Lancement à la main depuis l'onglet Actions, ou en poussant une étiquette v*.
name: Installateurs

on:
  workflow_dispatch:
    inputs:
      plateforme:
        description: Système pour lequel construire l'installateur
        type: choice
        default: toutes
        options: [toutes, windows, macos, linux]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(
          inputs.plateforme == 'windows' && '["windows-latest"]' ||
          inputs.plateforme == 'macos' && '["macos-latest"]' ||
          inputs.plateforme == 'linux' && '["ubuntu-latest"]' ||
          '["windows-latest","macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Vérifier que l'app démarre (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dist/mac-arm64/FeedSwitch.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/FeedSwitch" > demarrage.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            grep -q "FeedSwitch est prêt" demarrage.log && break
            sleep 1
          done
          kill "$pid" || true
          cat demarrage.log
          grep -q "FeedSwitch est prêt" demarrage.log
      - uses: actions/upload-artifact@v4
        with:
          name: FeedSwitch-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
